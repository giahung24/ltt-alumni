name: Export STREAMLIT_SECRETS_TOML

# One-off recovery workflow (private repo): uploads the secret as a PLAIN-TEXT
# artifact. Run scripts/recover_secret.sh, then delete this file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write secret to file
        env:
          STREAMLIT_SECRETS_TOML: ${{ secrets.STREAMLIT_SECRETS_TOML }}
        run: |
          if [ -z "$STREAMLIT_SECRETS_TOML" ]; then
            echo "::error::Missing STREAMLIT_SECRETS_TOML repository secret." >&2
            exit 1
          fi
          printf '%s' "$STREAMLIT_SECRETS_TOML" > secrets.toml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-secrets
          path: secrets.toml
          retention-days: 1
          if-no-files-found: error
